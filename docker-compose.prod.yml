services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: ${PROD_ENV_FILE:-.env.production}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
  postgres:
    image: postgres:16-alpine
    container_name: taco-loco-prod-postgres
    restart: unless-stopped
    env_file: ${PROD_ENV_FILE:-.env.production}
    environment:
      POSTGRES_DB: taco_loco
      POSTGRES_USER: taco_loco
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - taco_loco_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taco_loco -d taco_loco"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  taco_loco_prod_data:
